name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # global.css is generated from src/design/theme.json. If it is stale, a
      # NativeWind class and useTheme() disagree about a colour, and the contrast
      # tests silently stop guarding what ships.
      - name: Theme CSS is up to date
        run: |
          pnpm --filter @vocab-u/mobile theme:css
          git diff --exit-code apps/mobile/global.css

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The corpus build IS a test: validation is a gate, so a content defect
      # (a stressless transcription, an unreviewed example, a one-way synonym)
      # fails the build and therefore fails CI.
      - name: Build corpus
        run: pnpm corpus:build

      # The committed vocab.db must be exactly what the gate emits. The build is
      # reproducible, so this is a byte comparison: it catches a database edited
      # by hand, or committed from data that never passed validation.
      - name: Committed corpus matches a fresh build
        run: |
          pnpm prepare:assets
          git diff --exit-code apps/mobile/assets/corpus/vocab.db

      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: vocab-db
          path: |
            tools/corpus/out/vocab.db
            tools/corpus/out/manifest.json

      # Building the app is the only check that catches a bundler-level break
      # (a bad import path, a missing asset extension) that typecheck cannot see.
      - name: Bundle the app
        run: |
          pnpm prepare:assets
          pnpm --filter @vocab-u/mobile export:web
