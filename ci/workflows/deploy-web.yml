# Deploys the PWA to GitHub Pages on every push to the default branch.
#
# This is the whole hosting story: a static export on free infrastructure, no
# server, no database, no bill. The app works offline once loaded because the
# corpus ships inside it.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # The corpus is a build artifact, not a checked-in binary: it is compiled
      # from the datasets on every build, so a content change cannot be shipped
      # without passing the validation gate.
      - run: pnpm corpus:build
      - run: pnpm prepare:assets

      - run: pnpm --filter @vocab-u/mobile export:web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
